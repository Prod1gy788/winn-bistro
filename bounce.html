<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        @keyframes ani {
            0%{
                top: 0%;
                left: 0%;
            }
            15%{
                top: 60px;
                left: 10%;
            }
            30%{
                top: 0%;
                left: 30%;
            }
            45%{
                top: 70px;
                left: 40%;
            }
            60%{
                top: 0;
                left: 55%;
            }
            75%{
                top: 70px;
                left: 70%;
            }
            90%{
                top: 0%;
                left: 85%;
            }
            100%{
                top: 50%;
                left: 100%;
            }
        }
        div{
            background-color: aquamarine;
            height: 100px;
            width: 100px;
            border-radius: 50%;
            position: absolute;
            animation-name: ani;
            animation-duration: 3s;
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
